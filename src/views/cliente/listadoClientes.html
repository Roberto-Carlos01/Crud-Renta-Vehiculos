<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f4f7fa;
        }

        .header{
            background:white;
            padding:25px;
            border-radius:20px;
        }

        .cliente-card{
            border:none;
            border-radius:20px;
            transition:.3s;
        }

        .cliente-card:hover{
            transform:translateY(-8px);
        }

        .avatar{
            width:70px;
            height:70px;
            border-radius:50%;
            background:#0d6efd;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:1.4rem;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="header shadow-sm mb-4">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h1 class="fw-bold">

                    Clientes

                </h1>

                <p class="text-muted mb-0">

                    Administración de clientes registrados

                </p>

            </div>

            <a href="/clientes/nuevo"
                class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>
                Nuevo Cliente

            </a>

        </div>

    </div>

    <div class="row mb-4">

        <div class="col-md-6">

            <input
                type="text"
                id="buscador"
                class="form-control form-control-lg"
                placeholder="Buscar cliente...">

        </div>

    </div>

    <div id="contenedorClientes"
        class="row g-4">

    </div>

</div>

<script>

let clientes = [];

async function cargarClientes(){

    try{

        const response =
        await fetch(
            "http://localhost:3000/api/clientes"
        );

        clientes = await response.json();

        renderizarClientes(clientes);

    }
    catch(error){

        console.error(error);

    }

}

function renderizarClientes(lista){

    const contenedor =
    document.getElementById(
        "contenedorClientes"
    );

    contenedor.innerHTML = "";

    lista.forEach(cliente=>{

        const iniciales =
        cliente.nombre[0].toUpperCase() +
        cliente.apellido[0].toUpperCase();

        contenedor.innerHTML += `
        
        <div class="col-md-6 col-lg-4">

            <div class="card cliente-card shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex align-items-center mb-3">

                        <div class="avatar">

                            ${iniciales}

                        </div>

                        <div class="ms-3">

                            <h5 class="mb-0">

                                ${cliente.nombre}
                                ${cliente.apellido}

                            </h5>

                            <small class="text-muted">

                                Cliente

                            </small>

                        </div>

                    </div>

                    <hr>

                    <p>

                        <i class="bi bi-credit-card"></i>

                        ${cliente.ci}

                    </p>

                    <p>

                        <i class="bi bi-telephone"></i>

                        ${cliente.telefono}

                    </p>

                    <a
                        href="/clientes/${cliente.idcliente}"
                        class="btn btn-primary w-100">

                        Ver Perfil

                    </a>

                </div>

            </div>

        </div>

        `;
    });

}

document
.getElementById("buscador")
.addEventListener(
    "input",
    e=>{

        const texto =
        e.target.value.toLowerCase();

        const filtrados =
        clientes.filter(cliente=>

            cliente.nombre
            .toLowerCase()
            .includes(texto)

            ||

            cliente.apellido
            .toLowerCase()
            .includes(texto)

            ||

            cliente.ci
            .toLowerCase()
            .includes(texto)

        );

        renderizarClientes(
            filtrados
        );

    }
);

cargarClientes();

</script>

</body>

</html>
